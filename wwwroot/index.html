    <style>
        /* Loader screen — visible pendant le chargement de Blazor */
        #bible-loader {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #3949ab 100%);
            z-index: 99999;
            font-family: 'Inter', sans-serif;
            transition: opacity 0.4s ease;
        }
        #bible-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loader-container {
            text-align: center;
            padding: 2rem;
        }
        .loader-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            animation: loaderPulse 2s ease-in-out infinite;
        }
        .loader-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid #ffd54f;
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            animation: loaderSpin 0.8s linear infinite;
        }
        .loader-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.5rem;
            letter-spacing: 0.5px;
        }
        .loader-subtitle {
            font-size: 1rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 0.25rem;
        }
        .loader-progress-bar {
            width: 240px;
            height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
            margin: 1.5rem auto 0.75rem;
            overflow: hidden;
        }
        .loader-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffd54f, #ffb300);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .loader-percent {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffd54f;
            margin: 0.5rem 0 0.25rem;
            transition: opacity 0.3s;
        }
        .loader-text {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
        }
        @keyframes loaderSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes loaderPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>

<body>
    <!-- Persistent loader (outside #app, removed by JS when Blazor is ready) -->
    <div id="bible-loader">
        <div class="loader-container">
            <div class="loader-icon">📖</div>
            <div class="loader-spinner"></div>
            <div class="loader-title">Bible Louis Segond</div>
            <div class="loader-subtitle" id="loader-subtitle">Préparation...</div>
            <div class="loader-progress-bar">
                <div class="loader-progress-fill" id="loader-progress-fill"></div>
            </div>
            <div class="loader-percent" id="loader-percent">0%</div>
            <div class="loader-text" id="loader-text">Chargement de l'application</div>
        </div>
    </div>

    <!-- Blazor mount point -->
    <div id="app"></div>

    <div id="google_translate_element" style="display:none;"></div>

    <script>
        (function() {
            var fill = document.getElementById('loader-progress-fill');
            var pct = document.getElementById('loader-percent');
            var text = document.getElementById('loader-text');
            var subtitle = document.getElementById('loader-subtitle');

            window.hideLoader = function() {
                if (window._loaderDone) return;
                window._loaderDone = true;
                var el = document.getElementById('bible-loader');
                if (el) {
                    if (fill) fill.style.width = '100%';
                    if (pct) pct.textContent = '100%';
                    if (text) text.textContent = 'Bienvenue !';
                    if (subtitle) subtitle.textContent = 'Pret';
                    el.classList.add('hidden');
                    setTimeout(function() { el.style.display = 'none'; }, 400);
                }
            };

            var messages = ["Preparation...", "Chargement du noyau...", "Modules...", "Presque pret..."];
            var mi = 0;
            (function tick() {
                if (window._loaderDone) return;
                if (text) text.textContent = messages[mi % messages.length];
                mi++;
                setTimeout(tick, 1800);
            })();

            var target = document.getElementById('app');
            if (target) {
                var observer = new MutationObserver(function() {
                    if (target.children.length > 0) {
                        window.hideLoader();
                        observer.disconnect();
                    }
                });
                observer.observe(target, { childList: true, subtree: true });
            }

            window.bibleRecover = function() {
                try { localStorage.clear(); } catch (e) {}
                if (navigator.serviceWorker) {
                    navigator.serviceWorker.getRegistrations().then(function(regs) {
                        return Promise.all(regs.map(function(r) { return r.unregister(); }));
                    }).then(function() { location.reload(); })
                      .catch(function() { location.reload(); });
                } else {
                    location.reload();
                }
            };

            try {
                var lastVer = localStorage.getItem('bibeli-sw-version');
                if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                    fetch('/service-worker-assets.js', { cache: 'no-store' })
                        .then(function(r) { return r.text(); })
                        .then(function(t) {
                            var m = t.match(/Manifest version: ([^\s*]+)/);
                            var ver = m ? m[1] : null;
                            if (ver && lastVer && ver !== lastVer) {
                                if (!sessionStorage.getItem('bibeli-reloaded')) {
                                    sessionStorage.setItem('bibeli-reloaded', '1');
                                    window.bibleRecover();
                                }
                            }
                            if (ver) localStorage.setItem('bibeli-sw-version', ver);
                        }).catch(function() {});
                }
            } catch (e) {}

            setTimeout(function() {
                if (window._loaderDone) return;
                window._loaderDone = true;
                var el = document.getElementById('bible-loader');
                if (el) {
                    el.innerHTML =
                        '<div class="loader-container">' +
                        '<div style="font-size:3rem;margin-bottom:1rem;">&#9888;</div>' +
                        '<div class="loader-title" style="margin-bottom:0.5rem;">Probleme de chargement</div>' +
                        '<div class="loader-subtitle" style="margin-bottom:1.5rem;line-height:1.6;">' +
                        "L'application n'a pas pu se charger.<br/>Cela arrive souvent apres une mise a jour." +
                        '</div>' +
                        '<button onclick="bibleRecover()" style="background:#ffd54f;color:#1a237e;border:none;padding:12px 32px;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;margin-right:8px;">Reessayer</button>' +
                        '<button onclick="location.reload()" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.4);padding:12px 32px;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;">Recharger</button>' +
                        '</div>';
                }
            }, 20000);
        })();
    </script>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Service worker registration
        navigator.serviceWorker.register('service-worker.js');

        // Global error handler — catch unhandled JS errors
        window.addEventListener('error', function(e) {
            console.error('[Global Error]', e.error || e.message);
            var loader = document.getElementById('bible-loader');
            if (loader && loader.style.display !== 'none' && !window._loaderDone) {
                window._loaderDone = true;
                loader.innerHTML =
                    '<div class="loader-container">' +
                    '<div style="font-size:3rem;margin-bottom:1rem;">⚠️</div>' +
                    '<div class="loader-title" style="margin-bottom:0.5rem;">Erreur technique</div>' +
                    '<div class="loader-subtitle" style="margin-bottom:1.5rem;line-height:1.6;">' +
                    'Une erreur est survenue lors du chargement.<br/>' +
                    'Essaie de recharger la page.' +
                    '</div>' +
                    '<button onclick="location.reload()" style="background:#ffd54f;color:#1a237e;border:none;padding:12px 32px;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;">Réessayer</button>' +
                    '</div>';
            }
        });
    </script>
</body>
