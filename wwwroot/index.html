    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Bible Louis Segond",
      "url": "https://bibeli.vercel.app/",
      "description": "Lire la Bible Louis Segond (LSG) en ligne et hors-ligne. Recherche plein texte, audio, marque-pages, notes, quiz biblique, et carte des lieux.",
      "applicationCategory": "Religion",
      "operatingSystem": "Web",
      "offers": {"@type": "Offer", "price": "0", "priceCurrency": "EUR"},

        "@type": "Book",
        "name": "La Bible",

        "inLanguage": "fr"
      }
    }

    <style>
        /* Loader screen — visible pendant le chargement de Blazor */
        #bible-loader {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #3949ab 100%);
            z-index: 99999;
            font-family: 'Inter', sans-serif;
            transition: opacity 0.4s ease;
        }
        #bible-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loader-container {
            text-align: center;
            padding: 2rem;
        }
        .loader-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            animation: loaderPulse 2s ease-in-out infinite;
        }
        .loader-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid #ffd54f;
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            animation: loaderSpin 0.8s linear infinite;
        }
        .loader-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.5rem;
            letter-spacing: 0.5px;
        }
        .loader-subtitle {
            font-size: 1rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 0.25rem;
        }
        .loader-progress-bar {
            width: 240px;
            height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
            margin: 1.5rem auto 0.75rem;
            overflow: hidden;
        }
        .loader-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffd54f, #ffb300);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .loader-text {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
        }
        @keyframes loaderSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes loaderPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>

<body>
    <!-- Persistent loader (outside #app, removed by JS when Blazor is ready) -->
    <div id="bible-loader">
        <div class="loader-container">
            <div class="loader-icon">📖</div>
            <div class="loader-spinner"></div>
            <div class="loader-title">Bible Louis Segond</div>
            <div class="loader-subtitle" id="loader-subtitle">Préparation...</div>
            <div class="loader-progress-bar">
                <div class="loader-progress-fill" id="loader-progress-fill"></div>
            </div>
            <div class="loader-text" id="loader-text">Chargement de l'application</div>
        </div>
    </div>

    <!-- Blazor mount point -->
    <div id="app"></div>

    <div id="google_translate_element" style="display:none;"></div>

    <script>
        (function() {
            var fill = document.getElementById('loader-progress-fill');
            var text = document.getElementById('loader-text');
            var subtitle = document.getElementById('loader-subtitle');
            var steps = [
                [5, "Préparation..."],
                [15, "Chargement du noyau..."],
                [30, "Téléchargement des composants..."],
                [50, "Optimisation..."],
                [70, "Configuration de l'interface..."],
                [85, "Finalisation..."],
                [95, "Presque prêt..."],
                [100, "Lancement..."]
            ];
            var i = 0;
            (function next() {
                if (window._loaderDone || i >= steps.length) return;
                fill.style.width = steps[i][0] + '%';
                text.textContent = steps[i][1];
                if (steps[i][0] >= 100) subtitle.textContent = 'Prêt ✓';
                i++;
                setTimeout(next, 900 + Math.random() * 1100);
            })();

            window.hideLoader = function() {
                if (window._loaderDone) return;
                window._loaderDone = true;
                var el = document.getElementById('bible-loader');
                if (el) {
                    var f = document.getElementById('loader-progress-fill');
                    var t = document.getElementById('loader-text');
                    if (f) f.style.width = '100%';
                    if (t) t.textContent = 'Bienvenue !';
                    el.classList.add('hidden');
                    setTimeout(function() { el.style.display = 'none'; }, 400);
                }
            };

            // MutationObserver: dès que Blazor remplit #app → on cache le loader
            var target = document.getElementById('app');
            if (target) {
                var observer = new MutationObserver(function() {
                    if (target.children.length > 0) {
                        window.hideLoader();
                        observer.disconnect();
                    }
                });
                observer.observe(target, { childList: true, subtree: true });
                // Fallback: si Blazor ne charge pas en 30s, on cache quand même le loader
                setTimeout(function() {
                    observer.disconnect();
                    window.hideLoader();
                }, 30000);
            }
        })();
    </script>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/app.js"></script>
    <script>
        navigator.serviceWorker.register('service-worker.js');
    </script>
</body>

</html>
